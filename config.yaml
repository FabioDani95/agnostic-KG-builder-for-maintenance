
shared_models: &strong_models
  - id: gpt-5.4
    label: GPT-5.4
  - id: gpt-5.4-mini
    label: GPT-5.4 Mini
  - id: gpt-5.4-nano
    label: GPT-5.4 Nano
  - id: gpt-5.4-pro
    label: GPT-5.4 Pro

pipeline:
  mode: multi_agent

agents:
  scoping:
    enabled: true
    model: gpt-5.4-nano
    timeout: 60
  ontology_draft:
    enabled: true
    model: gpt-5.4
    timeout: 120
  extraction:
    enabled: true
    model: gpt-5.4
    timeout: 120
  validation:
    enabled: true
    model: gpt-5.4
    timeout: 90
  refiner:
    enabled: false
    model: gpt-5.4
    timeout: 90
    max_retries_per_entity: 2
    escalate_after_exhaustion: true
  coverage:
    enabled: false
    model: gpt-5.4-nano
    timeout: 60
  grounding:
    enabled: false
    model: gpt-5.4
    timeout: 90
  conflict_resolution:
    enabled: false
    model: gpt-5.4
    timeout: 60

supervisor:
  mode: deterministic
  llm_model: gpt-5.4-nano
  llm_timeout: 15

checkpointing:
  enabled: false
  backend: filesystem
  path: data/checkpoints/

validation:
  grounding_accept_threshold: 0.8
  grounding_refine_threshold: 0.5
  check_ontology_chain: true
  check_page_attribution: true

style_cleanup:
  enabled: true
  deterministic_enabled: true
  llm_enabled: true
  timeout_seconds: 120
  max_output_tokens: 6000
  preserve_numbers_units_codes: true
  preserve_page_refs: true
  reject_on_semantic_drift: true
  max_name_tokens: 10
  max_description_sentences: 2
  editable_fields:
    Asset: [name, description]
    Component: [name, description, category]
    Symptom: [name, description]
    FailureMode: [name, description, material_context]
    CorrectiveAction: [name, description, instruction_text]
    ErrorCode: [name, description]

scoping:
  max_pages: 12

  small_doc_threshold: 15

  timeout_seconds: 120

  max_input_chars: 90000
  estimated_max_input_tokens: 22000
  max_output_tokens: 2200

  models: *strong_models

extraction:
  timeout_seconds: 300

  max_input_chars: 220000
  estimated_max_input_tokens: 55000
  max_output_tokens: 6500

  models: *strong_models

ontology:
  always_include_first_pages: 5

  timeout_seconds: 600

  max_input_chars: 600000
  estimated_max_input_tokens: 150000
  extraction_max_output_tokens: 20000
  extraction_retry_max_output_tokens: 24000
  relation_extraction_max_output_tokens: 6000
  validation_max_output_tokens: 4000

  max_pages_per_chunk: 30

reflective_loop:
  max_retries: 2

  retry_on_severity: "error"

  re_extract_max_output_tokens: 14000

confidence:
  enabled: true

  theta_high: 0.80
  theta_low: 0.45

  auto_reject_enabled: false

  weights:
    evidence_present: 0.25
    corroboration: 0.15
    required_props_complete: 0.25
    chain_participation: 0.20
    clean_extraction: 0.15

  penalties:
    human_binding_required: 0.20
    per_retry: 0.02
