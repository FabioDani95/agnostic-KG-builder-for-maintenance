# ─── KG Diagnostic Extraction - Configuration ───

shared_models: &strong_models
  - id: gpt-5.4
    label: GPT-5.4
  - id: gpt-5.4-mini
    label: GPT-5.4 Mini
  - id: gpt-5.4-nano
    label: GPT-5.4 Nano
  - id: gpt-5.4-pro
    label: GPT-5.4 Pro

pipeline:
  # Execution mode for the extraction stack.
  # "classic" keeps the current production flow.
  # "multi_agent" routes the existing operator flow through agent wrappers,
  # GraphState persistence, and supervisor observability without changing
  # the endpoint contracts.
  mode: multi_agent

agents:
  scoping:
    enabled: true
    model: gpt-5.4-nano
    timeout: 60
  ontology_draft:
    enabled: true
    model: gpt-5.4
    timeout: 120
  extraction:
    enabled: true
    model: gpt-5.4
    timeout: 120
  validation:
    enabled: true
    model: gpt-5.4
    timeout: 90
  refiner:
    enabled: false
    model: gpt-5.4
    timeout: 90
    max_retries_per_entity: 2
    escalate_after_exhaustion: true
  coverage:
    enabled: false
    model: gpt-5.4-nano
    timeout: 60
  grounding:
    enabled: false
    model: gpt-5.4
    timeout: 90
  conflict_resolution:
    enabled: false
    model: gpt-5.4
    timeout: 60

supervisor:
  mode: deterministic
  llm_model: gpt-5.4-nano
  llm_timeout: 15

checkpointing:
  enabled: false
  backend: filesystem
  path: data/checkpoints/

validation:
  grounding_accept_threshold: 0.8
  grounding_refine_threshold: 0.5
  check_ontology_chain: true
  check_page_attribution: true

style_cleanup:
  # Final export-only normalization pass. This never changes ids, relations,
  # page references, codes, or schema keys; it only standardizes human-readable text.
  enabled: true
  deterministic_enabled: true
  llm_enabled: true
  timeout_seconds: 120
  max_output_tokens: 6000
  preserve_numbers_units_codes: true
  preserve_page_refs: true
  reject_on_semantic_drift: true
  max_name_tokens: 10
  max_description_sentences: 2
  editable_fields:
    Asset: [name, description]
    Component: [name, description, category]
    Symptom: [name, description]
    FailureMode: [name, description, material_context]
    CorrectiveAction: [name, description, instruction_text]
    ErrorCode: [name, description]

scoping:
  # Maximum number of pages to read for scoping analysis.
  # The engine will always read first N pages + any ToC/keyword pages found.
  max_pages: 12

  # Small-document threshold: skip cut plan if total pages <= this value.
  small_doc_threshold: 15

  # Timeout in seconds for the scoping LLM call.
  timeout_seconds: 120

  # Guardrails to avoid overspending on large prompts.
  max_input_chars: 90000
  estimated_max_input_tokens: 22000
  max_output_tokens: 2200

  # Available models for scoping (shown in UI dropdown).
  models: *strong_models

extraction:
  # Timeout in seconds for the extraction LLM call.
  timeout_seconds: 300

  # Guardrails to avoid overspending on large prompts.
  max_input_chars: 220000
  estimated_max_input_tokens: 55000
  max_output_tokens: 6500

  # Available models for extraction (shown in UI dropdown).
  models: *strong_models

ontology:
  # Number of leading pages always included in ontology extraction regardless of cut-plan.
  # These pages typically contain component diagrams/parts lists that the cut-plan excludes.
  # Set to 0 to disable.
  always_include_first_pages: 5

  # Timeout in seconds for each ontology LLM call.
  timeout_seconds: 600

  # Guardrails for ontology drafting and validation.
  # GPT-5.x supports large context windows — raised limits accordingly.
  max_input_chars: 600000
  estimated_max_input_tokens: 150000
  extraction_max_output_tokens: 20000
  # Safety retry budget used only when GPT-5 spends the visible completion budget
  # on reasoning and returns "{}" for a large ontology chunk.
  extraction_retry_max_output_tokens: 24000
  # Relation-only second pass on a compact node set plus filtered page subset.
  relation_extraction_max_output_tokens: 6000
  validation_max_output_tokens: 4000

  # Maximum pages per ontology extraction chunk.
  # Keeps each LLM call focused — large sections are sub-divided automatically.
  # 30 pages ≈ a focused chapter. Raise to 50 if you want fewer, larger chunks.
  max_pages_per_chunk: 30

reflective_loop:
  # Maximum number of automatic re-extraction attempts before escalating to human review.
  # Set to 0 to disable the loop and fall back to the linear pipeline.
  max_retries: 2

  # Minimum severity level of semantic issues that trigger a retry ("error" or "warning").
  # Issues below this severity are logged but do not trigger re-extraction.
  retry_on_severity: "error"

  # Max output tokens for the re-extraction LLM call.
  # Slightly higher than the initial extraction to accommodate the feedback payload.
  re_extract_max_output_tokens: 14000

confidence:
  # Step 3 of the agentic roadmap — schema-aware confidence scoring for adaptive HITL.
  # Set enabled=false to bypass scoring entirely (zero overhead, compatible with legacy flows).
  enabled: true

  # Classification thresholds (0.0–1.0).
  # score >= theta_high           → auto_approve
  # theta_low <= score < theta_high → human_review
  # score < theta_low             → human_review (unless auto_reject_enabled=true)
  theta_high: 0.80
  theta_low: 0.45

  # Safety flag: when false (default), items below theta_low still go to human_review
  # instead of being silently dropped. Enable only after validating precision on held-out data.
  auto_reject_enabled: false

  # Signal weights — must be non-negative. The scorer normalizes them to sum to 1.0.
  # Schema-aware means: these signals are computed using the live OntologySchemaDefinition,
  # so adding a new node type or relation in ontology_schema.JSON requires no code change here.
  weights:
    # Evidence presence: node has at least one OntologyEvidence with a source_page.
    evidence_present: 0.25
    # Corroboration: number of distinct source_pages supporting the node (saturates at 3).
    corroboration: 0.15
    # Required-property completeness: fraction of schema-required props present and non-empty.
    required_props_complete: 0.25
    # Schema-chain participation: node has the schema-expected outgoing/incoming relations.
    chain_participation: 0.20
    # Clean extraction: no retries needed and no semantic/schema issues targeting this node.
    clean_extraction: 0.15

  # Penalties applied after the weighted score is computed (subtracted from the final score).
  penalties:
    # Deducted if the node has any unresolved HumanRequiredField entry.
    human_binding_required: 0.20
    # Deducted per retry attempt consumed by the reflective loop (capped at 3× the value).
    per_retry: 0.02
