
chat:
  model: gpt-5.6-terra
  timeout: 30
  max_output_tokens: 1500
  critic_model: gpt-5.6-terra
  critic_enabled: true
  idle_reminder_seconds: 60

shared_models: &strong_models
  - id: gpt-5.6-sol
    label: GPT-5.6 Sol
  - id: gpt-5.6-terra
    label: GPT-5.6 Terra
  - id: gpt-5.6-luna
    label: GPT-5.6 Luna

pipeline:
  mode: multi_agent

# Preserve the physical PDF page map and invoke OCR only when native text is
# too sparse to be useful. OCR is decided before the immutable evidence
# inventory; budget-skipped low-text pages retain an explicit disposition.
pdf_ingestion:
  preserve_all_pages: true
  ocr:
    enabled: true
    language: eng
    dpi: 200
    min_confidence: 0.80
    min_native_chars: 80
    bootstrap_pages: 15
    bootstrap_max_pages: 5
    selected_max_pages: 24
    inventory_max_pages: 24

agents:
  scoping:
    enabled: true
    model: gpt-5.6-luna
    reasoning_effort: low
    timeout: 60
  ontology_draft:
    enabled: true
    # Low-cost acceptance profile: Luna is used end-to-end, with medium
    # reasoning reserved for semantic extraction and run-level completion.
    model: gpt-5.6-luna
    reasoning_effort: low
    timeout: 120
  extraction:
    enabled: true
    model: gpt-5.6-terra
    timeout: 120
  validation:
    enabled: true
    model: gpt-5.6-terra
    timeout: 90
  refiner:
    enabled: false
    model: gpt-5.6-terra
    timeout: 90
    max_retries_per_entity: 2
    escalate_after_exhaustion: true
  coverage:
    enabled: false
    model: gpt-5.6-luna
    timeout: 60
  grounding:
    enabled: false
    model: gpt-5.6-terra
    timeout: 90
  conflict_resolution:
    enabled: false
    model: gpt-5.6-terra
    timeout: 60

supervisor:
  mode: deterministic
  llm_model: gpt-5.6-luna
  llm_timeout: 15

checkpointing:
  enabled: false
  backend: filesystem
  path: data/checkpoints/

validation:
  grounding_accept_threshold: 0.8
  grounding_refine_threshold: 0.5
  check_ontology_chain: true
  check_page_attribution: true

resolution_completion:
  enabled: true
  timeout_seconds: 90
  max_input_chars: 50000
  estimated_max_input_tokens: 12500
  max_output_tokens: 2500
  # Only incomplete branches with an observed Symptom/ErrorCode are targets.
  # The cap makes worst-case cost independent of a noisy draft.
  max_targets: 6
  top_pages_per_target: 6
  context_window_pages: 1
  # Retrieve candidate pages from the FULL manual, not only the pages the cut
  # plan kept for drafting: a remedy often lives in a maintenance/reference
  # chapter the scoping pass dropped as non-diagnostic. The LLM still sees only
  # top_pages_per_target pages, so this widens the search space, not the prompt.
  search_full_manual: true

# Second-harvest pass: one targeted call that returns diagnostic chains stated
# in the text but missing from the draft (branch coverage is nondeterministic
# run-to-run). Strictly additive; chains without a verified verbatim quote are
# dropped before application.
coverage_completion:
  enabled: true
  timeout_seconds: 120
  max_input_chars: 120000
  estimated_max_input_tokens: 30000
  # Medium-reasoning models can consume part of the completion budget before
  # emitting the bounded JSON. Keep enough room for the final response.
  max_output_tokens: 7000
  max_chains: 8

pdf_generation_cost_guard:
  enabled: true
  # Safe production default. Explicit acceptance runs may temporarily raise
  # this envelope, but the checked-in policy remains fail-closed.
  preferred_cost_usd: 0.35
  hard_ceiling_usd: 0.49
  fixed_prompt_overhead_characters: 30000

style_cleanup:
  enabled: true
  deterministic_enabled: true
  llm_enabled: true
  timeout_seconds: 120
  max_output_tokens: 6000
  preserve_numbers_units_codes: true
  preserve_page_refs: true
  reject_on_semantic_drift: true
  max_name_tokens: 10
  max_description_sentences: 2
  editable_fields:
    Asset: [name, description]
    Component: [name, description, category]
    Symptom: [name, description]
    FailureMode: [name, description, material_context]
    CorrectiveAction: [name, description, instruction_text]
    ErrorCode: [name, description]

scoping:
  small_doc_threshold: 15

  timeout_seconds: 120

  max_input_chars: 90000
  estimated_max_input_tokens: 22000
  # Large manuals produce multi-page ToCs with hundreds of entries: 2200
  # tokens truncated the ToC-extraction JSON on a 588-page manual.
  max_output_tokens: 6000

  models: *strong_models

extraction:
  timeout_seconds: 300

  max_input_chars: 220000
  estimated_max_input_tokens: 55000
  max_output_tokens: 6500

  models: *strong_models

ontology:
  always_include_first_pages: 5

  timeout_seconds: 600

  # Keep long-document extraction below connection/capacity pressure and retry
  # only the failed chunk when the provider has a transient transport error.
  # Serial execution makes the spend ledger deterministic and avoids bursts.
  chunk_concurrency: 1
  chunk_retry_attempts: 1
  chunk_retry_base_seconds: 2

  max_input_chars: 600000
  estimated_max_input_tokens: 150000
  extraction_max_output_tokens: 16000
  # Compact strict schema used only by the diagnostic record-first path.
  diagnostic_bundle_max_output_tokens: 8000
  # Dense troubleshooting tables can exhaust the initial 16k response budget.
  # Keep ordinary drafts at 16k; only a detected truncation retries with headroom.
  extraction_retry_max_output_tokens: 24000
  relation_extraction_max_output_tokens: 6000
  validation_max_output_tokens: 4000

  # ToC signature changes are context only. Pages are packed by bounded size.
  max_pages_per_chunk: 8
  diagnostic_chunk_overlap_pages: 1
  structural_max_pages_per_chunk: 12

  # Nodes and relations are extracted as evidence bundles in one call. The
  # separate relation/validator passes are skipped for role-partitioned PDFs.
  relation_first: true

  # Optional selective recovery for diagnostic chunks that fail the typed
  # Luna contract. Disabled with a zero cap by default: enabling it reserves
  # the full bounded Terra envelope in the PDF cost preflight before any call.
  diagnostic_escalation:
    enabled: false
    primary_model: gpt-5.6-luna
    model: gpt-5.6-terra
    reasoning_effort: medium
    # Terra is opt-in per authorized run and never a whole-manual replacement.
    max_chunks_per_run: 0
    timeout_seconds: 180
    # Keep the retry materially smaller than the ordinary ontology guardrails.
    max_input_chars: 60000
    estimated_max_input_tokens: 15000
    # Structured Output JSON schema/envelope is billed prompt context too.
    schema_overhead_characters: 10000
    max_output_tokens: 4000

reflective_loop:
  max_retries: 0

  retry_on_severity: "error"

  re_extract_max_output_tokens: 14000

confidence:
  enabled: true

  # Triage thresholds (Fase A2). A node scoring >= theta_high is auto-accepted
  # (green); below it goes to the human-review queue (red). Calibration note:
  # on the LG sample these values send ~13% of nodes to review, and they are the
  # right ones (CorrectiveActions with no evidence at 0.25-0.40, borderline
  # Symptom/FailureMode at ~0.75 with an incomplete chain), while auto-approved
  # nodes sit at 0.80-0.98. Re-tune against an annotated "golden" manual set for
  # a formal balanced calibration. Note: structural open gaps always reach the
  # operator via the review queue regardless of score (review_queue_service),
  # so a generous theta_high never lets an unresolved chain pass silently.
  theta_high: 0.80
  theta_low: 0.45

  auto_reject_enabled: false

  weights:
    evidence_present: 0.25
    corroboration: 0.15
    required_props_complete: 0.25
    chain_participation: 0.20
    clean_extraction: 0.15

  penalties:
    human_binding_required: 0.20
    per_retry: 0.02
    ungrounded_evidence: 0.15
