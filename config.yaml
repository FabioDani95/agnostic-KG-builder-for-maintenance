# Reading of PDF manuals (backend/adapters/pdf.py). Pages with too little native
# text are read with OCR; the V3 run settings are in backend/kg_v3/run.py
# (RunConfig) and on the command line of scripts/kg_v3.py.
pdf_ingestion:
  preserve_all_pages: true
  ocr:
    enabled: true
    language: eng
    dpi: 200
    min_confidence: 0.80
    min_native_chars: 80
    bootstrap_pages: 15
    bootstrap_max_pages: 5
    selected_max_pages: 24
    inventory_max_pages: 24
