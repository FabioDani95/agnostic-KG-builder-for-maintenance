[project]
name = "agnostic-kg-builder-for-maintenance"
version = "0.1.0"
description = "Agentic neurosymbolic knowledge-graph builder for maintenance diagnostics"
requires-python = ">=3.12"
# Runtime dependencies are managed in requirements.txt (installed by run.sh).
dynamic = ["dependencies"]

[tool.setuptools]
# Non-installable application repo: tooling config only, no package build.
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", "output", "output_e2e", "runs_e2e", "batch_runs", "benchmark_runs", "eval_runs", "data", "manuals"]

[tool.ruff.lint]
# F: pyflakes (dead imports/variables, undefined names)
# E4/E7/E9: pycodestyle errors, I: import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "modify", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `backend`/`modify` import under the bare
# `pytest` console script (CI), not just under `python -m pytest`.
pythonpath = ["."]
addopts = "-q --ignore=tests/chatbot_e2e_test.py"
