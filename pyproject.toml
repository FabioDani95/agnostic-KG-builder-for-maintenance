[project]
name = "agnostic-kg-builder-for-maintenance"
version = "0.1.0"
description = "Evidence-bound maintenance knowledge graphs from PDF manuals (V3 pipeline)"
requires-python = ">=3.12"
# Runtime dependencies are managed in requirements.txt.
dynamic = ["dependencies"]

[tool.setuptools]
# Non-installable application repo: tooling config only, no package build.
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"
# Frozen experiment programs under paper/ are evidence, not active source to reformat.
extend-exclude = ["eval_runs", "data", "paper/experiments"]

[tool.ruff.lint]
# F: pyflakes (dead imports/variables, undefined names)
# E4/E7/E9: pycodestyle errors, I: import sorting
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `backend` imports under the bare
# `pytest` console script (CI), not just under `python -m pytest`.
pythonpath = ["."]
addopts = "-q"
